# Cau hinh thi nghiem chung cho M1, M2, M3

project:
  seed: 42
  crs: "EPSG:26916"          # He toa do UTM 16N, don vi met
  features: [x_m, y_m]       # Su dung toa do lam dac trung

paths:
  model_input: data/processed/model_input.parquet
  manifest: data/manifests/model_input_manifest.json
  labels_dir: outputs/labels
  run_log: outputs/metrics/run_log.csv
  figures_dir: outputs/figures
  maps_dir: outputs/maps
  pilot_m2: data/pilot_m2/pilot_m2_v0.parquet
  pilot_m2_manifest: data/pilot_m2/pilot_m2_v0_manifest.json
  raw_dir: data/raw
  manifests_dir: data/manifests

# M1: Khoang thoi gian thu thap du lieu
extract:
  start: "2023-04-17"
  end: "2023-05-14"

# Cac lat cat thoi gian
time_slices:
  WEEKDAY_AM:
    weekdays: [0, 1, 2, 3, 4]
    hours: [7, 8, 9]
  WEEKDAY_PM:
    weekdays: [0, 1, 2, 3, 4]
    hours: [16, 17, 18]
  WEEKEND:
    weekdays: [5, 6]
    hours: all

# Cau hinh lay mau
sampling:
  pilot_sizes: [10000, 30000, 50000]
  target_size: 100000

# Cau hinh danh gia
evaluation:
  silhouette_max_sample: 20000
  min_clusters_for_metrics: 2
  ram_stop_ratio: 0.85

# K-Means
kmeans:
  k_min: 2
  k_max: 15
  init: k-means++
  n_init: 10
  max_iter: 300
  k_final: 5

# DBSCAN
dbscan:
  mode: weighted
  eps_m: [500, 750, 1000, 1250, 1500, 2000, 2500, 3000]
  min_samples_frac: [0.001, 0.003, 0.005, 0.01]
  min_samples: [5, 20]
  final: {min_samples_frac: 0.01, eps_m: 2000}
  secondary: {min_samples_frac: 0.005, eps_m: 1000}
  metric: euclidean
  algorithm: auto
  n_jobs: -1

# HDBSCAN: M3 bo sung